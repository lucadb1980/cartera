<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Portfolio DCA"/>
<title>Portfolio DCA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#070b14 0%,#0d1424 50%,#070b14 100%);color:#f1f5f9;font-family:"Trebuchet MS","Segoe UI",sans-serif;min-height:100vh}
input,select{color:#f1f5f9;font-family:inherit;font-size:14px}
.card{border-radius:16px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);padding:16px}
.btn{cursor:pointer;border:none;font-family:inherit;font-weight:700}
.tab-btn{background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;min-width:44px}
.inp{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:8px 12px;color:#f1f5f9;outline:none}
.sel{width:100%;background:#0d1424;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:8px 12px;color:#f1f5f9;outline:none}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.animate-pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const h = React.createElement;
const {useState,useEffect,useCallback,useMemo} = React;
const {AreaChart,Area,PieChart,Pie,Cell,XAxis,YAxis,CartesianGrid,Tooltip,ResponsiveContainer,Legend} = Recharts;

// ── CONSTANTS ─────────────────────────────────────────────────────────────
const TM = {
  renta_variable:{label:"Renta Variable",  color:"#3b82f6",icon:"📈",fixed:false},
  renta_fija:    {label:"Renta Fija",      color:"#f59e0b",icon:"🏦",fixed:false},
  metales:       {label:"Metales",         color:"#eab308",icon:"🥇",fixed:true},
  alternativos:  {label:"Alternativos",    color:"#8b5cf6",icon:"🏢",fixed:true},
  crypto:        {label:"Crypto",          color:"#f97316",icon:"₿", fixed:true},
  liquidez:      {label:"Liquidez / DCA",  color:"#22c55e",icon:"💰",fixed:true},
};

const DEF_TYP = [
  {id:"renta_variable",targetPct:30},
  {id:"renta_fija",targetPct:20},
  {id:"metales",targetPct:11.25},
  {id:"alternativos",targetPct:15},
  {id:"crypto",targetPct:7},
  {id:"liquidez",targetPct:8.75},
];

const DEF_PROF = {name:"Luca",birthdate:"1980-01-15"};

const DEF_POS = [
  {id:1,typology:"renta_variable",name:"Vanguard Global Stock Index EUR Acc",ticker:"VWRL",isin:"IE00B03HD191",broker:"MyInvestor",ter:0.18,shares:264.8,entryPrice:95.40,entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:2,typology:"renta_variable",name:"Vanguard Global Stock Index EUR Acc",ticker:"VWRL",isin:"IE00B03HD191",broker:"MyInvestor",ter:0.18,shares:13.4,entryPrice:112.00,entryDate:"2026-01-10",exitDate:null,exitPrice:null},
  {id:3,typology:"renta_variable",name:"Vanguard Emerging Markets Stock Idx",ticker:"VFEM",isin:"IE0031786696",broker:"MyInvestor",ter:0.23,shares:250.0,entryPrice:48.00,entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:4,typology:"renta_fija",name:"Vanguard Global Bond Idx EUR Hedged",ticker:"VAGF",isin:"IE00B18GC888",broker:"MyInvestor",ter:0.15,shares:909.0,entryPrice:22.00,entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:5,typology:"metales",name:"iShares Physical Gold EUR Hedged ETC",ticker:"IGLD",isin:"IE0009JOT9U1",broker:"DEGIRO",ter:0.25,shares:120.8,entryPrice:62.10,entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:6,typology:"metales",name:"iShares Physical Silver ETC",ticker:"ISLN",isin:"IE00B4NCWG09",broker:"DEGIRO",ter:0.20,shares:267.8,entryPrice:14.00,entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:7,typology:"alternativos",name:"iShares Dev. Markets Property Yield",ticker:"IWDP",isin:"IE00B1FZS350",broker:"DEGIRO",ter:0.59,shares:322.5,entryPrice:31.00,entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:8,typology:"alternativos",name:"Invesco Bloomberg Commodity UCITS",ticker:"CMOD",isin:"IE00BD6FTQ80",broker:"DEGIRO",ter:0.19,shares:263.1,entryPrice:19.00,entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:9,typology:"crypto",name:"iShares Bitcoin ETP",ticker:"IB1T",isin:"IE0003UVYC20",broker:"Trade Republic",ter:0.15,shares:823.5,entryPrice:8.50,entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:10,typology:"liquidez",name:"Cuenta Remunerada Trade Republic",ticker:"CASH",isin:"—",broker:"Trade Republic",ter:0,shares:8750,entryPrice:1.00,entryDate:"2025-01-15",exitDate:null,exitPrice:null},
];

const FB = {VWRL:107.2,VFEM:51.3,VAGF:22.4,IGLD:71.5,ISLN:16.5,IWDP:33.0,CMOD:19.8,IB1T:13.6,CASH:1.0};
const YFM = {VWRL:"VWRL.L",VFEM:"VFEM.L",VAGF:"VAGF.L",IWDP:"IWDP.L",IGLD:"IGLD.L",ISLN:"ISLN.L",CMOD:"CMOD.L",IB1T:"IB1T.DE"};

// ── HELPERS ───────────────────────────────────────────────────────────────
const fmt   = v=>"\u20ac"+Number(v).toLocaleString("es-ES",{maximumFractionDigits:0});
const fmtD  = v=>"\u20ac"+Number(v).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtP  = v=>Number(v).toFixed(2)+"%";
const fmtPS = v=>(v>0?"+":"")+Number(v).toFixed(2)+"%";

function calcAge(bd){
  const b=new Date(bd),n=new Date();
  let a=n.getFullYear()-b.getFullYear();
  if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;
  return a;
}
function annRet(ed,xd,ep,cp){
  const s=new Date(ed),e=xd?new Date(xd):new Date();
  const y=(e-s)/(1000*60*60*24*365.25);
  if(y<=0)return 0;
  return(Math.pow(cp/ep,1/y)-1)*100;
}
function calcFormula(age,typs){
  const rvPct=90-age+10;
  const fixedTotal=typs.filter(t=>TM[t.id]?.fixed).reduce((s,t)=>s+t.targetPct,0);
  const available=100-fixedTotal;
  return{rvPct,fixedTotal,available,rvTarget:+(available*(rvPct/100)).toFixed(2),rfTarget:+(available*(1-rvPct/100)).toFixed(2)};
}
function devColor(d){const n=Math.abs(d);return n<1?"#22c55e":n<3?"#f59e0b":"#ef4444";}
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch{return def;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

async function fetchPrice(ticker){
  const sym=YFM[ticker];if(!sym)return null;
  try{
    const r=await fetch("https://query1.finance.yahoo.com/v8/finance/chart/"+sym+"?interval=1d&range=5d");
    if(!r.ok)throw new Error();
    const d=await r.json();
    const meta=d?.chart?.result?.[0]?.meta||{};
    const last=meta.regularMarketPrice,prev=meta.chartPreviousClose;
    if(!last)throw new Error();
    return{price:+last.toFixed(2),change:prev?+((last-prev)/prev*100).toFixed(2):0,currency:meta.currency||"USD",live:true};
  }catch{return null;}
}

async function getAIAdvice(byTypology,age,formula,contribAmt){
  const summary=byTypology.map(t=>t.label+": obj "+t.targetPct+"%, real "+t.realPct.toFixed(2)+"%, desv "+(t.dev>=0?"+":"")+t.dev.toFixed(2)+"%").join("\n");
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
      messages:[{role:"user",content:"Eres asesor experto en carteras indexadas y DCA. Inversor de "+age+" a\u00f1os.\n\nTIPOLOG\u00cdAS:\n"+summary+"\n\nAportaci\u00f3n anual: \u20ac"+contribAmt+"\nF\u00f3rmula: RV "+formula.rvTarget.toFixed(1)+"% / RF "+formula.rfTarget.toFixed(1)+"%\n\nResponde en espa\u00f1ol:\n1. Estado (1-2 frases)\n2. Tipolog\u00edas m\u00e1s desviadas\n3. C\u00f3mo distribuir \u20ac"+contribAmt+" por tipolog\u00eda\n4. Nivel: VERDE/AMARILLO/ROJO\n5. Consejo clave\n\nM\u00e1x 250 palabras, importes concretos."}]})
  });
  const d=await res.json();
  return d.content?.[0]?.text||"Sin respuesta.";
}

// ── COMPONENTS ────────────────────────────────────────────────────────────
function Card(props){
  return h("div",{className:"card "+(props.className||""),style:props.style,onClick:props.onClick},props.children);
}
function Inp({label,value,onChange,type="text",placeholder=""}){
  return h("div",{style:{marginBottom:8}},
    label&&h("div",{style:{fontSize:11,color:"#94a3b8",marginBottom:4}},label),
    h("input",{type,value,onChange,placeholder,className:"inp"})
  );
}
function Sel({label,value,onChange,options}){
  return h("div",{style:{marginBottom:8}},
    label&&h("div",{style:{fontSize:11,color:"#94a3b8",marginBottom:4}},label),
    h("select",{value,onChange,className:"sel"},
      options.map(o=>h("option",{key:o.value,value:o.value,style:{background:"#0d1424"}},o.label))
    )
  );
}
function Pill({children,color="#3b82f6"}){
  return h("span",{className:"pill",style:{background:color+"20",color}},children);
}

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const [profile,   setProfile]   = useState(()=>load("pf_profile",DEF_PROF));
  const [typologies,setTypologies]= useState(()=>load("pf_typologies",DEF_TYP));
  const [positions, setPositions] = useState(()=>load("pf_positions",DEF_POS));
  const [liveData,  setLiveData]  = useState({});
  const [tab,       setTab]       = useState("dashboard");
  const [modal,     setModal]     = useState(null);
  const [contribAmt,setContribAmt]= useState(()=>load("pf_contrib",5000));
  const [advice,    setAdvice]    = useState("");
  const [advLoad,   setAdvLoad]   = useState(false);
  const [lastUpd,   setLastUpd]   = useState(null);

  useEffect(()=>save("pf_profile",profile),[profile]);
  useEffect(()=>save("pf_typologies",typologies),[typologies]);
  useEffect(()=>save("pf_positions",positions),[positions]);
  useEffect(()=>save("pf_contrib",contribAmt),[contribAmt]);

  const age     = useMemo(()=>calcAge(profile.birthdate),[profile.birthdate]);
  const formula = useMemo(()=>calcFormula(age,typologies),[age,typologies]);
  const liveP   = useCallback(t=>liveData[t]?.price||FB[t]||1,[liveData]);

  const enriched = useMemo(()=>positions.map(p=>{
    const cp=liveP(p.ticker),inv=p.shares*p.entryPrice;
    const cv=p.exitDate?p.shares*(p.exitPrice||p.entryPrice):p.shares*cp;
    const pnl=cv-inv;
    return{...p,cp,inv,cv,pnl,pnlPct:(pnl/inv)*100,
      annReturn:annRet(p.entryDate,p.exitDate,p.entryPrice,p.exitDate?(p.exitPrice||p.entryPrice):cp),
      isOpen:!p.exitDate};
  }),[positions,liveP]);

  const openPos  = useMemo(()=>enriched.filter(p=>p.isOpen),[enriched]);
  const totalVal = useMemo(()=>openPos.reduce((s,p)=>s+p.cv,0),[openPos]);
  const totalInv = useMemo(()=>openPos.reduce((s,p)=>s+p.inv,0),[openPos]);
  const totalPnl = totalVal-totalInv;
  const typSum   = typologies.reduce((s,t)=>s+t.targetPct,0);

  const byTypology = useMemo(()=>typologies.map(t=>{
    const tp=openPos.filter(p=>p.typology===t.id);
    const val=tp.reduce((s,p)=>s+p.cv,0);
    const rp=totalVal>0?(val/totalVal)*100:0;
    return{...t,...TM[t.id],value:val,realPct:rp,dev:rp-t.targetPct,positions:tp};
  }),[openPos,totalVal,typologies]);

  const fetchLive=useCallback(async()=>{
    const tickers=[...new Set(positions.map(p=>p.ticker).filter(t=>t!=="CASH"))];
    const res=await Promise.allSettled(tickers.map(t=>fetchPrice(t)));
    const nl={};
    res.forEach((r,i)=>{if(r.status==="fulfilled"&&r.value)nl[tickers[i]]=r.value;});
    setLiveData(nl);setLastUpd(new Date());
  },[positions]);

  useEffect(()=>{fetchLive();},[]);

  const proj=Array.from({length:11},(_,i)=>({
    year:String(2025+i),
    c6: Math.round(totalVal*1.06**i+(i>0?contribAmt*((1.06**i-1)/0.06):0)),
    b9: Math.round(totalVal*1.09**i+(i>0?contribAmt*((1.09**i-1)/0.09):0)),
    o13:Math.round(totalVal*1.13**i+(i>0?contribAmt*((1.13**i-1)/0.13):0)),
  }));

  const openAdd =(typology=null)=>setModal({mode:"add",data:{typology:typology||"renta_variable",name:"",ticker:"",isin:"",broker:"",ter:0,shares:0,entryPrice:0,entryDate:new Date().toISOString().slice(0,10),exitDate:"",exitPrice:""}});
  const openEdit=p=>setModal({mode:"edit",data:{...p}});
  const openClose=p=>setModal({mode:"close",data:{...p,exitDate:new Date().toISOString().slice(0,10),exitPrice:liveP(p.ticker)}});

  const saveModal=()=>{
    const d=modal.data;
    if(modal.mode==="add"){
      setPositions(prev=>[...prev,{...d,id:Date.now(),color:TM[d.typology]?.color||"#3b82f6",exitDate:d.exitDate||null,exitPrice:d.exitPrice||null}]);
    }else if(modal.mode==="edit"){
      setPositions(prev=>prev.map(p=>p.id===d.id?{...d,exitDate:d.exitDate||null,exitPrice:d.exitPrice||null}:p));
    }else{
      setPositions(prev=>prev.map(p=>p.id===d.id?{...p,exitDate:d.exitDate,exitPrice:parseFloat(d.exitPrice)}:p));
    }
    setModal(null);
  };

  const delPos=id=>{if(confirm("¿Eliminar esta posición?"))setPositions(prev=>prev.filter(p=>p.id!==id));};
  const setTypTarget=(id,v)=>setTypologies(prev=>prev.map(t=>t.id===id?{...t,targetPct:parseFloat(v)||0}:t));

  const TABS=[
    {id:"dashboard",icon:"◈",label:"Home"},
    {id:"typologies",icon:"⬡",label:"Tipos"},
    {id:"positions",icon:"▤",label:"Posic."},
    {id:"contribute",icon:"＋",label:"Aportar"},
    {id:"dca",icon:"◎",label:"DCA"},
    {id:"projection",icon:"◇",label:"Proyec."},
    {id:"profile",icon:"👤",label:"Perfil"},
  ];

  const pieData=byTypology.map(t=>({name:t.label,value:Math.max(t.value,0.01),color:t.color}));

  // ── RENDER ───────────────────────────────────────────────────────────────
  return h("div",{style:{minHeight:"100vh",paddingBottom:"env(safe-area-inset-bottom)"}},

    // TOP BAR
    h("div",{style:{position:"sticky",top:0,zIndex:50,borderBottom:"1px solid rgba(255,255,255,0.05)",background:"rgba(0,0,0,0.7)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)"}},
      h("div",{style:{padding:"10px 14px",display:"flex",alignItems:"center",gap:10}},
        h("div",{style:{width:34,height:34,borderRadius:10,background:"linear-gradient(135deg,#1d4ed8,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:900,flexShrink:0}},"◈"),
        h("div",{style:{flex:1,minWidth:0}},
          h("div",{style:{fontWeight:900,fontSize:13,color:"white"}},profile.name+" · Portfolio"),
          h("div",{style:{fontSize:10,color:"#64748b"}},age+"a · RV "+formula.rvTarget.toFixed(0)+"% / RF "+formula.rfTarget.toFixed(0)+"%"+(lastUpd?" · "+lastUpd.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"}):"")),
        ),
        h("button",{className:"btn",onClick:fetchLive,style:{padding:"6px 10px",borderRadius:8,border:"1px solid rgba(59,130,246,0.3)",background:"rgba(59,130,246,0.1)",color:"#60a5fa",fontSize:12}},"⟳"),
        h("div",{style:{textAlign:"right",flexShrink:0}},
          h("div",{style:{fontSize:10,color:"#64748b"}},"Total"),
          h("div",{style:{fontWeight:900,color:"#34d399",fontSize:14}},fmt(totalVal)),
          h("div",{style:{fontSize:10,fontWeight:700,color:totalPnl>=0?"#34d399":"#f87171"}},(totalPnl>=0?"+":"")+fmt(totalPnl)),
        ),
      ),
      h("div",{style:{display:"flex",overflowX:"auto",padding:"0 8px",gap:2}},
        TABS.map(t=>h("button",{key:t.id,className:"tab-btn",
          onClick:()=>setTab(t.id),
          style:{borderBottomColor:tab===t.id?"#3b82f6":"transparent",color:tab===t.id?"#3b82f6":"#475569"}},
          h("span",{style:{fontSize:14}},t.icon),
          h("span",{style:{fontSize:9,fontWeight:700}},t.label),
        ))
      ),
    ),

    // CONTENT
    h("div",{style:{maxWidth:720,margin:"0 auto",padding:"14px 12px",display:"flex",flexDirection:"column",gap:14}},

      // ── DASHBOARD ──
      tab==="dashboard"&&h("div",{style:{display:"flex",flexDirection:"column",gap:14}},
        h("div",{className:"grid2"},
          [{label:"Capital",val:fmt(totalVal),color:"#3b82f6"},
           {label:"P&L Total",val:(totalPnl>=0?"+":"")+fmt(totalPnl),color:totalPnl>=0?"#22c55e":"#ef4444"},
           {label:"Σ Tipos",val:fmtP(typSum),color:Math.abs(typSum-100)<0.01?"#22c55e":"#f59e0b"},
           {label:"Posiciones",val:openPos.length+" abiertas",color:"#8b5cf6"},
          ].map(s=>h(Card,{key:s.label,style:{padding:12}},
            h("div",{style:{fontSize:10,color:"#94a3b8"}},s.label),
            h("div",{style:{fontWeight:900,fontSize:15,color:s.color,marginTop:2}},s.val),
          ))
        ),
        h(Card,{},
          h("div",{style:{fontSize:12,fontWeight:700,color:"white",marginBottom:8}},"🧮 Fórmula por Edad"),
          h("div",{className:"grid2"},
            h("div",{style:{padding:8,borderRadius:10,background:"rgba(59,130,246,0.1)"}},
              h("div",{style:{fontSize:10,color:"#94a3b8"}},"RV sugerida"),
              h("div",{style:{color:"#3b82f6",fontWeight:900,fontSize:18}},formula.rvTarget.toFixed(1)+"%"),
              h("div",{style:{color:"#64748b",fontSize:10}},"90 - "+age+" + 10 = "+formula.rvPct+"%"),
            ),
            h("div",{style:{padding:8,borderRadius:10,background:"rgba(245,158,11,0.1)"}},
              h("div",{style:{fontSize:10,color:"#94a3b8"}},"RF sugerida"),
              h("div",{style:{color:"#f59e0b",fontWeight:900,fontSize:18}},formula.rfTarget.toFixed(1)+"%"),
              h("div",{style:{color:"#64748b",fontSize:10}},"del "+formula.available.toFixed(0)+"% disponible"),
            ),
          ),
        ),
        h(Card,{},
          h("div",{style:{fontSize:12,fontWeight:700,color:"white",marginBottom:8}},"Distribución por Tipología"),
          h(ResponsiveContainer,{width:"100%",height:170},
            h(PieChart,{},
              h(Pie,{data:pieData,cx:"50%",cy:"50%",innerRadius:40,outerRadius:75,paddingAngle:3,dataKey:"value"},
                pieData.map((e,i)=>h(Cell,{key:i,fill:e.color,stroke:"transparent"}))
              ),
              h(Tooltip,{formatter:v=>fmt(v),contentStyle:{background:"#0f172a",border:"1px solid #1e293b",borderRadius:8,fontSize:11}}),
            )
          ),
          byTypology.map(t=>{
            const dc=devColor(t.dev);
            return h("div",{key:t.id,style:{marginBottom:8}},
              h("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:3}},
                h("span",{},t.icon),
                h("span",{style:{fontSize:11,fontWeight:700,color:t.color,flex:1}},t.label),
                h("span",{style:{fontSize:10,color:"#64748b"}},fmt(t.value)),
                h("span",{style:{fontSize:11,fontWeight:700,color:dc}},fmtP(t.realPct)),
                h("span",{style:{fontSize:10,color:"#64748b"}},"/ "+fmtP(t.targetPct)),
              ),
              h("div",{style:{height:5,background:"rgba(255,255,255,0.05)",borderRadius:4,overflow:"hidden"}},
                h("div",{style:{height:"100%",borderRadius:4,background:t.color,opacity:0.75,width:Math.min(t.realPct/Math.max(t.targetPct,1)*100,100)+"%",maxWidth:"100%"}}),
              ),
              t.positions.length>0&&h("div",{style:{display:"flex",flexWrap:"wrap",gap:4,marginTop:4}},
                t.positions.map(p=>h("span",{key:p.id,style:{fontSize:9,padding:"2px 6px",borderRadius:99,background:t.color+"15",color:t.color}},p.ticker+" "+fmtP(p.cv/Math.max(totalVal,1)*100)))
              ),
            );
          }),
        ),
      ),

      // ── TYPOLOGIES ──
      tab==="typologies"&&h("div",{style:{display:"flex",flexDirection:"column",gap:12}},
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}},
          h("div",{},
            h("div",{style:{fontSize:16,fontWeight:900,color:"white"}},"Tipologías"),
            h("div",{style:{fontSize:10,color:"#64748b"}},"Define el % objetivo de cada bloque. Deben sumar 100%."),
          ),

              h("div",{style:{color:"#64748b"}},"Entrada "+modal.data.entryDate+" · "+fmtD(modal.data.entryPrice)),
            ),
            h(Inp,{label:"Fecha de venta",type:"date",value:modal.data.exitDate||"",onChange:e=>setModal(m=>({...m,data:{...m.data,exitDate:e.target.value}}))}),
            h(Inp,{label:"Precio de venta (€)",type:"number",value:modal.data.exitPrice||"",onChange:e=>setModal(m=>({...m,data:{...m.data,exitPrice:e.target.value}}))}),
          ):
          h("div",{style:{display:"flex",flexDirection:"column",gap:10}},
            h(Sel,{label:"Tipología",value:modal.data.typology||"renta_variable",
              onChange:e=>setModal(m=>({...m,data:{...m.data,typology:e.target.value}})),
              options:Object.entries(TM).map(([k,v])=>({value:k,label:v.icon+" "+v.label}))}),
            h(Inp,{label:"Nombre del producto",value:modal.data.name||"",onChange:e=>setModal(m=>({...m,data:{...m.data,name:e.target.value}}))}),
            h("div",{className:"grid2"},
              h(Inp,{label:"Ticker (ej: VWRL)",value:modal.data.ticker||"",onChange:e=>setModal(m=>({...m,data:{...m.data,ticker:e.target.value.toUpperCase()}}))}),
              h(Inp,{label:"ISIN",value:modal.data.isin||"",onChange:e=>setModal(m=>({...m,data:{...m.data,isin:e.target.value}}))}),
            ),
            h("div",{className:"grid2"},
              h(Inp,{label:"Broker",value:modal.data.broker||"",onChange:e=>setModal(m=>({...m,data:{...m.data,broker:e.target.value}}))}),
              h(Inp,{label:"TER (%)",type:"number",value:modal.data.ter||0,onChange:e=>setModal(m=>({...m,data:{...m.data,ter:parseFloat(e.target.value)||0}}))}),
            ),
            h("div",{className:"grid2"},
              h(Inp,{label:"Nº participaciones",type:"number",value:modal.data.shares||0,onChange:e=>setModal(m=>({...m,data:{...m.data,shares:parseFloat(e.target.value)||0}}))}),
              h(Inp,{label:"Precio entrada (€)",type:"number",value:modal.data.entryPrice||0,onChange:e=>setModal(m=>({...m,data:{...m.data,entryPrice:parseFloat(e.target.value)||0}}))}),
            ),
            h(Inp,{label:"Fecha de compra",type:"date",value:modal.data.entryDate||"",onChange:e=>setModal(m=>({...m,data:{...m.data,entryDate:e.target.value}}))}),
            modal.data.shares>0&&modal.data.entryPrice>0&&h("div",{style:{padding:"8px 12px",borderRadius:10,background:"rgba(255,255,255,0.04)",fontSize:11}},
              h("span",{style:{color:"#64748b"}},"Invertido: "),
              h("span",{style:{color:"white",fontWeight:700}},fmt(modal.data.shares*modal.data.entryPrice)),
              h("span",{style:{color:"#64748b",marginLeft:12}},"Peso aprox: "),
              h("span",{style:{color:"white",fontWeight:700}},fmtP(modal.data.shares*modal.data.entryPrice/Math.max(totalVal,1)*100)),
            ),
          ),
        h("div",{style:{display:"flex",gap:10,marginTop:16}},
          h("button",{className:"btn",onClick:()=>setModal(null),style:{flex:1,padding:"12px",borderRadius:12,border:"1px solid rgba(255,255,255,0.1)",background:"transparent",color:"#94a3b8",fontSize:13}},"Cancelar"),
          h("button",{className:"btn",onClick:saveModal,style:{flex:1,padding:"12px",borderRadius:12,border:"none",background:modal.mode==="close"?"linear-gradient(135deg,#dc2626,#991b1b)":"linear-gradient(135deg,#1d4ed8,#7c3aed)",color:"white",fontSize:13,cursor:"pointer"}},
            modal.mode==="close"?"Cerrar Posición":"Guardar"
          ),
        ),
      ),
    ),
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
