<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;
const { AreaChart, Area, PieChart, Pie, Cell, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend, BarChart, Bar } = Recharts;

// ── CONSTANTS ──────────────────────────────────────────────────────────────
const TYPOLOGY_META = {
  renta_variable:{ label:"Renta Variable",   color:"#3b82f6", icon:"📈", fixed:false },
  renta_fija:    { label:"Renta Fija",        color:"#f59e0b", icon:"🏦", fixed:false },
  metales:       { label:"Metales Preciosos", color:"#eab308", icon:"🥇", fixed:true  },
  alternativos:  { label:"Alternativos",      color:"#8b5cf6", icon:"🏢", fixed:true  },
  crypto:        { label:"Crypto",            color:"#f97316", icon:"₿",  fixed:true  },
  liquidez:      { label:"Liquidez / DCA",    color:"#22c55e", icon:"💰", fixed:true  },
};

const DEFAULT_TYPOLOGIES = [
  {id:"renta_variable",targetPct:30   },
  {id:"renta_fija",    targetPct:20   },
  {id:"metales",       targetPct:11.25},
  {id:"alternativos",  targetPct:15   },
  {id:"crypto",        targetPct:7    },
  {id:"liquidez",      targetPct:8.75 },
];

const DEFAULT_PROFILE = { name:"Luca", birthdate:"1980-01-15", annualContribution:5000 };

const DEFAULT_POSITIONS = [
  {id:1, typology:"renta_variable",name:"Vanguard Global Stock Index EUR Acc",ticker:"VWRL",isin:"IE00B03HD191",broker:"MyInvestor",    ter:0.18,shares:264.8,entryPrice:95.40, entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:2, typology:"renta_variable",name:"Vanguard Global Stock Index EUR Acc",ticker:"VWRL",isin:"IE00B03HD191",broker:"MyInvestor",    ter:0.18,shares:13.4, entryPrice:112.00,entryDate:"2026-01-10",exitDate:null,exitPrice:null},
  {id:3, typology:"renta_variable",name:"Vanguard Emerging Markets Stock Idx",ticker:"VFEM",isin:"IE0031786696",broker:"MyInvestor",    ter:0.23,shares:250.0,entryPrice:48.00, entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:4, typology:"renta_fija",    name:"Vanguard Global Bond Idx EUR Hedged",ticker:"VAGF",isin:"IE00B18GC888",broker:"MyInvestor",    ter:0.15,shares:909.0,entryPrice:22.00, entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:5, typology:"metales",       name:"iShares Physical Gold EUR Hedged ETC",ticker:"IGLD",isin:"IE0009JOT9U1",broker:"DEGIRO",       ter:0.25,shares:120.8,entryPrice:62.10, entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:6, typology:"metales",       name:"iShares Physical Silver ETC",         ticker:"ISLN",isin:"IE00B4NCWG09",broker:"DEGIRO",       ter:0.20,shares:267.8,entryPrice:14.00, entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:7, typology:"alternativos",  name:"iShares Dev. Markets Property Yield", ticker:"IWDP",isin:"IE00B1FZS350",broker:"DEGIRO",       ter:0.59,shares:322.5,entryPrice:31.00, entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:8, typology:"alternativos",  name:"Invesco Bloomberg Commodity UCITS",   ticker:"CMOD",isin:"IE00BD6FTQ80",broker:"DEGIRO",       ter:0.19,shares:263.1,entryPrice:19.00, entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:9, typology:"crypto",        name:"iShares Bitcoin ETP",                 ticker:"IB1T",isin:"IE0003UVYC20",broker:"Trade Republic",ter:0.15,shares:823.5,entryPrice:8.50,  entryDate:"2025-01-15",exitDate:null,exitPrice:null},
  {id:10,typology:"liquidez",      name:"Cuenta Remunerada Trade Republic",    ticker:"CASH",isin:"—",           broker:"Trade Republic",ter:0,   shares:8750, entryPrice:1.00,  entryDate:"2025-01-15",exitDate:null,exitPrice:null},
];

const FALLBACK_PRICES = {VWRL:107.2,VFEM:51.3,VAGF:22.4,IGLD:71.5,ISLN:16.5,IWDP:33.0,CMOD:19.8,IB1T:13.6,CASH:1.0};
const YF_MAP = {VWRL:"VWRL.L",VFEM:"VFEM.L",VAGF:"VAGF.L",IWDP:"IWDP.L",IGLD:"IGLD.L",ISLN:"ISLN.L",CMOD:"CMOD.L",IB1T:"IB1T.DE",CASH:null};

// ── HELPERS ────────────────────────────────────────────────────────────────
const fmt    = v => "€"+Number(v).toLocaleString("es-ES",{maximumFractionDigits:0});
const fmtD   = v => "€"+Number(v).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtP   = v => Number(v).toFixed(2)+"%";
const fmtPS  = v => (v>0?"+":"")+Number(v).toFixed(2)+"%";

function calcAge(bd){
  const b=new Date(bd),n=new Date();
  let a=n.getFullYear()-b.getFullYear();
  if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;
  return a;
}
function annualReturn(ed,xd,ep,cp){
  const s=new Date(ed),e=xd?new Date(xd):new Date();
  const y=(e-s)/(1000*60*60*24*365.25);
  if(y<=0)return 0;
  return(Math.pow(cp/ep,1/y)-1)*100;
}
function calcFormula(age,typs){
  const rvPct=90-age+10;
  const fixed=typs.filter(t=>TYPOLOGY_META[t.id]?.fixed);
  const fixedTotal=fixed.reduce((s,t)=>s+t.targetPct,0);
  const available=100-fixedTotal;
  return{rvPct,fixedTotal,available,rvTarget:+(available*(rvPct/100)).toFixed(2),rfTarget:+(available*(1-rvPct/100)).toFixed(2)};
}
function devColor(d){const n=Math.abs(d);return n<1?"#22c55e":n<3?"#f59e0b":"#ef4444";}

// ── STORAGE ───────────────────────────────────────────────────────────────
function load(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def;}catch{return def;}}
function save(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}}

// ── LIVE PRICE ────────────────────────────────────────────────────────────
async function fetchPrice(ticker){
  const sym=YF_MAP[ticker];
  if(!sym)return null;
  try{
    const r=await fetch("https://query1.finance.yahoo.com/v8/finance/chart/"+sym+"?interval=1d&range=5d");
    if(!r.ok)throw new Error();
    const d=await r.json();
    const meta=d?.chart?.result?.[0]?.meta||{};
    const last=meta.regularMarketPrice;
    const prev=meta.chartPreviousClose;
    if(!last)throw new Error();
    return{price:+last.toFixed(2),change:prev?+((last-prev)/prev*100).toFixed(2):0,currency:meta.currency||"USD",live:true};
  }catch{return null;}
}

// ── AI ADVICE ─────────────────────────────────────────────────────────────
async function getAIAdvice(byTypology,age,formula,contribAmt){
  const summary=byTypology.map(t=>t.label+": obj "+t.targetPct+"%, real "+t.realPct.toFixed(2)+"%, desv "+(t.dev>=0?"+":"")+t.dev.toFixed(2)+"%").join("\n");
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:"Eres asesor experto en carteras indexadas y DCA. Inversor de "+age+" años.\n\nESTADO POR TIPOLOGÍA:\n"+summary+"\n\nAportación anual: €"+contribAmt+"\nFórmula: RV "+formula.rvTarget.toFixed(1)+"% / RF "+formula.rfTarget.toFixed(1)+"%\n\nResponde en español:\n1. Estado (1-2 frases)\n2. Tipologías más desviadas\n3. Cómo distribuir €"+contribAmt+" por tipología\n4. Nivel: VERDE/AMARILLO/ROJO\n5. Consejo clave\n\nMáx 250 palabras, importes concretos."}]})
  });
  const d=await res.json();
  return d.content?.[0]?.text||"Sin respuesta.";
}

// ── UI PRIMITIVES ─────────────────────────────────────────────────────────
const Card=({children,className="",onClick,style={}})=>(
  <div onClick={onClick} style={style}
    className={"rounded-2xl border border-white/10 bg-white/5 "+(onClick?"cursor-pointer ":"")+className}>
    {children}
  </div>
);
const Pill=({children,color="#3b82f6"})=>(
  <span className="px-2 py-0.5 rounded-full text-xs font-bold" style={{background:color+"20",color,display:"inline-block"}}>{children}</span>
);
const Inp=({label,value,onChange,type="text",placeholder=""})=>(
  <div style={{marginBottom:4}}>
    {label&&<div style={{fontSize:11,color:"#94a3b8",marginBottom:4}}>{label}</div>}
    <input type={type} value={value} onChange={onChange} placeholder={placeholder}
      style={{width:"100%",background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"8px 12px",fontSize:14,color:"#f1f5f9",outline:"none"}}/>
  </div>
);
const Sel=({label,value,onChange,options})=>(
  <div style={{marginBottom:4}}>
    {label&&<div style={{fontSize:11,color:"#94a3b8",marginBottom:4}}>{label}</div>}
    <select value={value} onChange={onChange}
      style={{width:"100%",background:"#0d1424",border:"1px solid rgba(255,255,255,0.1)",borderRadius:12,padding:"8px 12px",fontSize:14,color:"#f1f5f9",outline:"none"}}>
      {options.map(o=><option key={o.value} value={o.value} style={{background:"#0d1424"}}>{o.label}</option>)}
    </select>
  </div>
);

// ── MAIN APP ──────────────────────────────────────────────────────────────
function App(){
  const [profile,   setProfile]   = useState(()=>load("pf_profile",DEFAULT_PROFILE));
  const [typologies,setTypologies]= useState(()=>load("pf_typologies",DEFAULT_TYPOLOGIES));
  const [positions, setPositions] = useState(()=>load("pf_positions",DEFAULT_POSITIONS));
  const [liveData,  setLiveData]  = useState({});
  const [tab,       setTab]       = useState("dashboard");
  const [modal,     setModal]     = useState(null);
  const [contribAmt,setContribAmt]= useState(()=>load("pf_contrib",5000));
  const [advice,    setAdvice]    = useState("");
  const [advLoad,   setAdvLoad]   = useState(false);
  const [lastUpd,   setLastUpd]   = useState(null);

  // Persist
  useEffect(()=>save("pf_profile",profile),[profile]);
  useEffect(()=>save("pf_typologies",typologies),[typologies]);
  useEffect(()=>save("pf_positions",positions),[positions]);
  useEffect(()=>save("pf_contrib",contribAmt),[contribAmt]);

  const age     = useMemo(()=>calcAge(profile.birthdate),[profile.birthdate]);
  const formula = useMemo(()=>calcFormula(age,typologies),[age,typologies]);

  const livePrice = useCallback(ticker=>liveData[ticker]?.price||FALLBACK_PRICES[ticker]||1,[liveData]);

  const enriched = useMemo(()=>positions.map(p=>{
    const cp=livePrice(p.ticker);
    const inv=p.shares*p.entryPrice;
    const cv=p.exitDate?p.shares*(p.exitPrice||p.entryPrice):p.shares*cp;
    const pnl=cv-inv;
    return{...p,cp,inv,cv,pnl,pnlPct:(pnl/inv)*100,
      annRet:annualReturn(p.entryDate,p.exitDate,p.entryPrice,p.exitDate?(p.exitPrice||p.entryPrice):cp),
      isOpen:!p.exitDate};
  }),[positions,livePrice]);

  const openPos  = useMemo(()=>enriched.filter(p=>p.isOpen),[enriched]);
  const totalVal = useMemo(()=>openPos.reduce((s,p)=>s+p.cv,0),[openPos]);
  const totalInv = useMemo(()=>openPos.reduce((s,p)=>s+p.inv,0),[openPos]);
  const totalPnl = totalVal-totalInv;
  const typSum   = typologies.reduce((s,t)=>s+t.targetPct,0);

  const byTypology = useMemo(()=>typologies.map(t=>{
    const tp=openPos.filter(p=>p.typology===t.id);
    const val=tp.reduce((s,p)=>s+p.cv,0);
    const rp=totalVal>0?(val/totalVal)*100:0;
    return{...t,...TYPOLOGY_META[t.id],value:val,realPct:rp,dev:rp-t.targetPct,positions:tp};
  }),[openPos,totalVal,typologies]);

  // Fetch live prices
  const fetchLive=useCallback(async()=>{
    const tickers=[...new Set(positions.map(p=>p.ticker).filter(t=>t!=="CASH"))];
    const res=await Promise.allSettled(tickers.map(t=>fetchPrice(t)));
    const nl={};
    res.forEach((r,i)=>{if(r.status==="fulfilled"&&r.value)nl[tickers[i]]=r.value;});
    setLiveData(nl);setLastUpd(new Date());
  },[positions]);

  useEffect(()=>{fetchLive();},[]);

  // Projection
  const proj=Array.from({length:11},(_,i)=>({
    year:String(2025+i),
    c6: Math.round(totalVal*1.06**i+(i>0?contribAmt*((1.06**i-1)/0.06):0)),
    b9: Math.round(totalVal*1.09**i+(i>0?contribAmt*((1.09**i-1)/0.09):0)),
    o13:Math.round(totalVal*1.13**i+(i>0?contribAmt*((1.13**i-1)/0.13):0)),
  }));

  // Modal helpers
  const openAdd  = (typology=null)=>setModal({mode:"add",data:{typology:typology||"renta_variable",name:"",ticker:"",isin:"",broker:"",ter:0,shares:0,entryPrice:0,entryDate:new Date().toISOString().slice(0,10),exitDate:"",exitPrice:""}});
  const openEdit = p=>setModal({mode:"edit",data:{...p}});
  const openClose= p=>setModal({mode:"close",data:{...p,exitDate:new Date().toISOString().slice(0,10),exitPrice:livePrice(p.ticker)}});

  const saveModal=()=>{
    const d=modal.data;
    if(modal.mode==="add"){
      setPositions(prev=>[...prev,{...d,id:Date.now(),color:TYPOLOGY_META[d.typology]?.color||"#3b82f6",exitDate:d.exitDate||null,exitPrice:d.exitPrice||null}]);
    }else if(modal.mode==="edit"){
      setPositions(prev=>prev.map(p=>p.id===d.id?{...d,exitDate:d.exitDate||null,exitPrice:d.exitPrice||null}:p));
    }else{
      setPositions(prev=>prev.map(p=>p.id===d.id?{...p,exitDate:d.exitDate,exitPrice:parseFloat(d.exitPrice)}:p));
    }
    setModal(null);
  };
  const delPos=id=>setPositions(prev=>prev.filter(p=>p.id!==id));
  const setTypTarget=(id,v)=>setTypologies(prev=>prev.map(t=>t.id===id?{...t,targetPct:parseFloat(v)||0}:t));

  const TABS=[
    {id:"dashboard", icon:"◈",label:"Home"},
    {id:"typologies",icon:"⬡",label:"Tipos"},
    {id:"positions", icon:"▤",label:"Posic."},
    {id:"contribute",icon:"＋",label:"Aportar"},
    {id:"dca",       icon:"◎",label:"DCA"},
    {id:"projection",icon:"◇",label:"Proyec."},
    {id:"profile",   icon:"👤",label:"Perfil"},
  ];

  const pieData=byTypology.map(t=>({name:t.label,value:t.value,color:t.color}));

  return (
    <div style={{minHeight:"100vh",paddingBottom:"env(safe-area-inset-bottom)"}}>
      {/* TOP BAR */}
      <div style={{position:"sticky",top:0,zIndex:50,borderBottom:"1px solid rgba(255,255,255,0.05)",background:"rgba(0,0,0,0.6)",backdropFilter:"blur(20px)",WebkitBackdropFilter:"blur(20px)"}}>
        <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,#1d4ed8,#7c3aed)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:900,flexShrink:0}}>◈</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:900,fontSize:13,color:"white"}}>{profile.name} · Portfolio</div>
            <div style={{fontSize:10,color:"#64748b"}}>
              {age}a · RV {formula.rvTarget.toFixed(0)}% / RF {formula.rfTarget.toFixed(0)}%
              {lastUpd&&" · "+lastUpd.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"})}
            </div>
          </div>
          <button onClick={fetchLive} style={{padding:"6px 10px",borderRadius:8,border:"1px solid rgba(59,130,246,0.3)",background:"rgba(59,130,246,0.1)",color:"#60a5fa",fontSize:12,fontWeight:700}}>⟳</button>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:10,color:"#64748b"}}>Total</div>
            <div style={{fontWeight:900,color:"#34d399",fontSize:14}}>{fmt(totalVal)}</div>
            <div style={{fontSize:10,fontWeight:700,color:totalPnl>=0?"#34d399":"#f87171"}}>{totalPnl>=0?"+":""}{fmt(totalPnl)}</div>
          </div>
        </div>
        {/* TAB BAR */}
        <div style={{display:"flex",overflowX:"auto",padding:"0 8px",gap:2}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)}
              style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"6px 8px",borderBottom:"2px solid",borderBottomColor:tab===t.id?"#3b82f6":"transparent",color:tab===t.id?"#3b82f6":"#475569",background:"none",border:"none",borderBottom:"2px solid "+(tab===t.id?"#3b82f6":"transparent"),whiteSpace:"nowrap",cursor:"pointer",minWidth:44}}>
              <span style={{fontSize:14}}>{t.icon}</span>
              <span style={{fontSize:9,fontWeight:700}}>{t.label}</span>
            </button>
          ))}
        </div>
      </div>

      {/* CONTENT */}
      <div style={{maxWidth:720,margin:"0 auto",padding:"16px 12px",display:"flex",flexDirection:"column",gap:16}}>

        {/* ── DASHBOARD ── */}
        {tab==="dashboard"&&<>
          {/* Stats */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {[
              {label:"Capital",val:fmt(totalVal),color:"#3b82f6"},
              {label:"P&L Total",val:(totalPnl>=0?"+":"")+fmt(totalPnl)+" ("+fmtPS(totalPnl/Math.max(totalInv,1)*100)+")",color:totalPnl>=0?"#22c55e":"#ef4444"},
              {label:"Σ Tipologías",val:fmtP(typSum),color:Math.abs(typSum-100)<0.01?"#22c55e":"#f59e0b"},
              {label:"Posiciones",val:openPos.length+" abiertas",color:"#8b5cf6"},
            ].map(s=>(
              <Card key={s.label} className="p-3">
                <div style={{fontSize:10,color:"#94a3b8"}}>{s.label}</div>
                <div style={{fontWeight:900,fontSize:15,color:s.color,marginTop:2}}>{s.val}</div>
              </Card>
            ))}
          </div>

          {/* Formula */}
          <Card className="p-4">
            <div style={{fontSize:12,fontWeight:700,color:"white",marginBottom:8}}>🧮 Fórmula por Edad</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:11}}>
              <div style={{padding:8,borderRadius:10,background:"rgba(59,130,246,0.1)"}}>
                <div style={{color:"#94a3b8"}}>RV sugerida</div>
                <div style={{color:"#3b82f6",fontWeight:900,fontSize:16}}>{formula.rvTarget.toFixed(1)}%</div>
                <div style={{color:"#64748b",fontSize:10}}>90 - {age} + 10 = {formula.rvPct}%</div>
              </div>
              <div style={{padding:8,borderRadius:10,background:"rgba(245,158,11,0.1)"}}>
                <div style={{color:"#94a3b8"}}>RF sugerida</div>
                <div style={{color:"#f59e0b",fontWeight:900,fontSize:16}}>{formula.rfTarget.toFixed(1)}%</div>
                <div style={{color:"#64748b",fontSize:10}}>del {formula.available.toFixed(0)}% disponible</div>
              </div>
            </div>
          </Card>

          {/* Pie */}
          <Card className="p-4">
            <div style={{fontSize:12,fontWeight:700,color:"white",marginBottom:8}}>Distribución por Tipología</div>
            <ResponsiveContainer width="100%" height={180}>
              <PieChart>
                <Pie data={pieData} cx="50%" cy="50%" innerRadius={42} outerRadius={75} paddingAngle={3} dataKey="value">
                  {pieData.map((e,i)=><Cell key={i} fill={e.color} stroke="transparent"/>)}
                </Pie>
                <Tooltip formatter={v=>fmt(v)} contentStyle={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:8,fontSize:11}}/>
              </PieChart>
            </ResponsiveContainer>
            {byTypology.map(t=>{
              const dc=devColor(t.dev);
              return(
                <div key={t.id} style={{marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                    <span>{t.icon}</span>
                    <span style={{fontSize:11,fontWeight:700,color:t.color,flex:1}}>{t.label}</span>
                    <span style={{fontSize:10,color:"#64748b"}}>{fmt(t.value)}</span>
                    <span style={{fontSize:11,fontWeight:700,color:dc}}>{fmtP(t.realPct)}</span>
                    <span style={{fontSize:10,color:"#64748b"}}>/ {fmtP(t.targetPct)}</span>
                  </div>
                  <div style={{height:6,background:"rgba(255,255,255,0.05)",borderRadius:4,overflow:"hidden",position:"relative"}}>
                    <div style={{height:"100%",borderRadius:4,background:t.color,opacity:0.75,width:Math.min(t.realPct/Math.max(t.targetPct,1)*100,100)+"%",maxWidth:"100%"}}/>

                {l:"Edad",v:age+" años",c:"white"},
                {l:"Fórmula",v:"90 - "+age+" + 10 = "+formula.rvPct+"%",c:"white"},
                {l:"RV sugerida",v:formula.rvTarget.toFixed(2)+"%",c:"#3b82f6"},
                {l:"RF sugerida",v:formula.rfTarget.toFixed(2)+"%",c:"#f59e0b"},
                {l:"Activos fijos",v:formula.fixedTotal.toFixed(2)+"%",c:"#8b5cf6"},
                {l:"Aportación",v:fmt(contribAmt)+"/año",c:"#22c55e"},
              ].map(s=>(
                <div key={s.l} style={{padding:8,borderRadius:8,background:"rgba(255,255,255,0.04)"}}>
                  <div style={{color:"#64748b",marginBottom:2}}>{s.l}</div>
                  <div style={{fontWeight:700,color:s.c}}>{s.v}</div>
                </div>
              ))}
            </div>
            <div style={{marginTop:10,fontSize:10,color:"#64748b",padding:"8px",borderRadius:8,background:"rgba(255,255,255,0.03)"}}>
              📅 El año que viene ({age+1} años): RV baja a ~{(formula.available*((formula.rvPct-1)/100)).toFixed(1)}%, RF sube. La cartera se vuelve más conservadora automáticamente.
            </div>
          </Card>

          <Card className="p-4" style={{border:"1px solid rgba(34,197,94,0.15)",background:"rgba(34,197,94,0.04)"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#22c55e",marginBottom:6}}>💾 Datos guardados</div>
            <div style={{fontSize:10,color:"#64748b"}}>
              Todos tus datos (posiciones, tipologías, perfil) se guardan automáticamente en este dispositivo. 
              No se pierden al cerrar Safari. Para hacer copia de seguridad, añade esta página a tus marcadores.
            </div>
          </Card>
        </>}

      </div>

      {/* ── MODAL ── */}
      {modal&&(
        <div style={{position:"fixed",inset:0,zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center",background:"rgba(0,0,0,0.75)",backdropFilter:"blur(8px)",WebkitBackdropFilter:"blur(8px)"}}>
          <div style={{width:"100%",maxWidth:600,background:"#0d1424",borderRadius:"24px 24px 0 0",border:"1px solid rgba(255,255,255,0.1)",padding:20,maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
              <div style={{fontSize:14,fontWeight:900,color:"white"}}>
                {modal.mode==="add"?"Nueva Posición":modal.mode==="close"?"Cerrar Posición":"Editar Posición"}
              </div>
              <button onClick={()=>setModal(null)} style={{width:28,height:28,borderRadius:8,border:"none",background:"rgba(255,255,255,0.08)",color:"#94a3b8",cursor:"pointer",fontSize:16}}>✕</button>
            </div>

            {modal.mode==="close"?(
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                <div style={{padding:10,borderRadius:10,background:"rgba(255,255,255,0.05)",fontSize:11}}>
                  <div style={{fontWeight:700,color:"white",marginBottom:2}}>{modal.data.name} · {modal.data.ticker}</div>
                  <div style={{color:"#64748b"}}>Entrada {modal.data.entryDate} · {fmtD(modal.data.entryPrice)}</div>
                </div>
                <Inp label="Fecha de venta" type="date" value={modal.data.exitDate||""}
                  onChange={e=>setModal(m=>({...m,data:{...m.data,exitDate:e.target.value}}))}/>
                <Inp label="Precio de venta (€)" type="number" value={modal.data.exitPrice||""}
                  onChange={e=>setModal(m=>({...m,data:{...m.data,exitPrice:e.target.value}}))}/>
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:12}}>
                <Sel label="Tipología" value={modal.data.typology||"renta_variable"}
                  onChange={e=>setModal(m=>({...m,data:{...m.data,typology:e.target.value}}))}
                  options={Object.entries(TYPOLOGY_META).map(([k,v])=>({value:k,label:v.icon+" "+v.label}))}/>
                <Inp label="Nombre del producto" value={modal.data.name||""}
                  onChange={e=>setModal(m=>({...m,data:{...m.data,name:e.target.value}}))}/>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <Inp label="Ticker (ej: VWRL)" value={modal.data.ticker||""}
                    onChange={e=>setModal(m=>({...m,data:{...m.data,ticker:e.target.value.toUpperCase()}}))}/>
                  <Inp label="ISIN" value={modal.data.isin||""}
                    onChange={e=>setModal(m=>({...m,data:{...m.data,isin:e.target.value}}))}/>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <Inp label="Broker" value={modal.data.broker||""}
                    onChange={e=>setModal(m=>({...m,data:{...m.data,broker:e.target.value}}))}/>
                  <Inp label="TER (%)" type="number" value={modal.data.ter||0}
                    onChange={e=>setModal(m=>({...m,data:{...m.data,ter:parseFloat(e.target.value)||0}}))}/>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                  <Inp label="Nº participaciones" type="number" value={modal.data.shares||0}
                    onChange={e=>setModal(m=>({...m,data:{...m.data,shares:parseFloat(e.target.value)||0}}))}/>
                  <Inp label="Precio entrada (€)" type="number" value={modal.data.entryPrice||0}
                    onChange={e=>setModal(m=>({...m,data:{...m.data,entryPrice:parseFloat(e.target.value)||0}}))}/>
                </div>
                <Inp label="Fecha de compra" type="date" value={modal.data.entryDate||""}
                  onChange={e=>setModal(m=>({...m,data:{...m.data,entryDate:e.target.value}}))}/>
                {modal.data.shares>0&&modal.data.entryPrice>0&&(
                  <div style={{padding:"8px 12px",borderRadius:10,background:"rgba(255,255,255,0.04)",fontSize:11}}>
                    <span style={{color:"#64748b"}}>Invertido: </span>
                    <span style={{color:"white",fontWeight:700}}>{fmt(modal.data.shares*modal.data.entryPrice)}</span>
                    <span style={{color:"#64748b",marginLeft:12}}>Peso aprox: </span>
                    <span style={{color:"white",fontWeight:700}}>{fmtP(modal.data.shares*modal.data.entryPrice/Math.max(totalVal,1)*100)}</span>
                  </div>
                )}
              </div>
            )}

            <div style={{display:"flex",gap:10,marginTop:16}}>
              <button onClick={()=>setModal(null)}
                style={{flex:1,padding:"12px",borderRadius:12,border:"1px solid rgba(255,255,255,0.1)",background:"transparent",color:"#94a3b8",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                Cancelar
              </button>
              <button onClick={saveModal}
                style={{flex:1,padding:"12px",borderRadius:12,border:"none",background:modal.mode==="close"?"linear-gradient(135deg,#dc2626,#991b1b)":"linear-gradient(135deg,#1d4ed8,#7c3aed)",color:"white",fontSize:13,fontWeight:700,cursor:"pointer"}}>
                {modal.mode==="close"?"Cerrar Posición":"Guardar"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
